<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Mission Ledger Books — clear, professional bookkeeping">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2032"/>
      <stop offset="1" stop-color="#0A1826"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#4FB088" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4FB088" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- ledger rules -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
  </g>
  <!-- brand mark -->
  <g transform="translate(90 90)">
    <rect width="96" height="96" rx="24" fill="#16283B" stroke="#4FB088" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M24 62 L44 42 L58 54 L80 28" fill="none" stroke="#4FB088" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M66 28 H80 V42" fill="none" stroke="#4FB088" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="70" width="56" height="6" rx="3" fill="#D8BE8C"/>
  </g>
  <text x="212" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#FBFAF6">Mission Ledger Books</text>
  <text x="212" y="186" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="3" fill="#D8BE8C">BOOKKEEPING &amp; ADVISORY</text>

  <text x="90" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#FBFAF6">Clear, professional</text>
  <text x="90" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#FBFAF6">bookkeeping<tspan fill="#4FB088" font-style="italic"> you can trust.</tspan></text>

  <text x="90" y="482" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FBFAF6" fill-opacity="0.72">For nonprofits and small &amp; midsize businesses.</text>

  <rect x="90" y="540" width="54" height="4" rx="2" fill="#B4894C"/>
  <text x="90" y="586" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FBFAF6" fill-opacity="0.55">missionledgerbooks.com</text>
  <text x="1110" y="586" text-anchor="end" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#4FB088">No job too small or too big.</text>
</svg>
